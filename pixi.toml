[workspace]
authors = ["Robert Bjornson <robert.bjornson@yale.edu>"]
channels = ["conda-forge"]
name = "archiveTree"
platforms = ["linux-64"]
version = "0.6.0"

[tasks]
archive = "python archive.py"
restore = "python restore.py"
browse = "python browse_inventory.py"
list-object-status = "python list_object_status.py"
status = "python list_object_status.py"   # short alias

# Install archiveTree itself into the environment (editable, so edits to the
# .py files here take effect without reinstalling). This is what puts the
# console scripts declared in pyproject.toml's [project.scripts] -- archive,
# restore, archive-to-s3, browse-inventory, etc. -- on PATH inside
# `pixi shell`, so they can be run by name rather than via `pixi run`.
[pypi-dependencies]
archiveTree = { path = ".", editable = true }

[dependencies]
# Pinned to exclude conda-forge's free-threaded ("nogil"/cp3XXt) build:
# without this, the solver can pick a freethreading build, and every run
# then prints a RuntimeWarning ("The global interpreter lock (GIL) has been
# enabled to load module '_brotli' ...") because _brotli (pulled in
# transitively via boto3/botocore) hasn't declared nogil safety. Nothing in
# this codebase benefits from free-threading (it uses ThreadPoolExecutor for
# I/O-bound work, which is fine under the GIL), so there's no reason to use
# that build.
python = "3.12.*"
boto3 = ">=1.43.73,<2"
globus-sdk = ">=4.9.0,<5"
tqdm = ">=4.70.0,<5"
awscrt = ">=0.36.2,<0.37"
